name: Swift CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-latest-xcode:
    # macos-26 is the current stable GitHub-hosted arm64 image. Its
    # /Applications/Xcode.app symlink points to the image's latest stable Xcode
    # (26.6); Xcode 27 is still a public preview and is not this gate's target.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select latest stable Xcode from the runner image
        run: |
          sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          swift --version
      - name: Build with type-check timing warnings
        run: swift build -Xswiftc -swift-version -Xswiftc 5 -Xswiftc -Xfrontend -Xswiftc -warn-long-expression-type-checking=300 -Xswiftc -Xfrontend -Xswiftc -warn-long-function-bodies=300
      - name: Test with type-check timing warnings
        run: swift test --disable-keychain -Xswiftc -swift-version -Xswiftc 5 -Xswiftc -Xfrontend -Xswiftc -warn-long-expression-type-checking=300 -Xswiftc -Xfrontend -Xswiftc -warn-long-function-bodies=300

  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Select Swift toolchain
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.1'
      - name: Check documentation consistency
        run: python3 scripts/check-docs.py
      - name: Test documentation checker
        run: python3 scripts/test-check-docs.py
      - name: Run tests
        # GRDB still exposes Dispatch-backed values that are not Sendable on
        # the macOS 14 SDK. Keep the package/toolchain current while compiling
        # the package in Swift 5 compatibility mode until that dependency is
        # annotated upstream.
        run: swift test -Xswiftc -swift-version -Xswiftc 5

  test-intel:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Select Swift toolchain
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.1'
      - name: Check documentation consistency
        run: python3 scripts/check-docs.py
      - name: Test documentation checker
        run: python3 scripts/test-check-docs.py
      - name: Run tests
        # Match the arm64 job's Swift 5 compatibility mode while disabling
        # keychain credential lookup in the non-interactive runner.
        run: swift test --disable-keychain -Xswiftc -swift-version -Xswiftc 5
